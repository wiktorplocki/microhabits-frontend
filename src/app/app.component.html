<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over">
      <mat-nav-list>
      <a mat-list-item routerLink="/" (click)="sidenav.close()">Strona główna</a>
      <a mat-list-item routerLink="/habits" (click)="sidenav.close()">Twoje nawyki</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        mat-icon-button
        (click)="sidenav.toggle()"
        aria-label="Menu"
        class="show-mobile"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <mat-icon class="app-icon">emoji_objects</mat-icon>
      <span class="app-title">Microhabits</span>
      <span class="spacer"></span>
      <a mat-button routerLink="/" class="hide-mobile">Strona główna</a>
      <a mat-button routerLink="/habits" class="hide-mobile">Twoje nawyki</a>
    </mat-toolbar>

    <router-outlet />
  </mat-sidenav-content>

</mat-sidenav-container>
